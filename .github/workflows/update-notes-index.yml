name: Update Notes Index

on:
  push:
    branches:
      - master
    paths:
      - "notes/**/*.html"
      - "tools/build-notes-index.mjs"
      - "tools/validate-notes.mjs"
      - "tools/build-sitemap.mjs"
      - "tools/test-site-build.mjs"
      - ".github/workflows/update-notes-index.yml"
      - "CNAME"
      - "!notes/index.html"
      - "!notes/_template.html"
  schedule:
    # Sunday 19:30 UTC = Monday 03:30 in Beijing.
    - cron: "30 19 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-notes-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-notes-index:
    if: github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate and rebuild notes index
        run: |
          node --test tools/test-site-build.mjs
          node tools/validate-notes.mjs
          node tools/build-notes-index.mjs
          node tools/build-sitemap.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- notes/notes-index.json notes/notes-index.js sitemap.xml robots.txt; then
            echo "No changes in index artifacts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/notes-index.json notes/notes-index.js sitemap.xml robots.txt
          git commit -m "Auto-update notes index and sitemap"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  refresh-pages:
    needs: build-notes-index
    if: needs.build-notes-index.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Rebuild Pages if it publishes from master / (root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq 'if .build_type == "legacy" then (.source.branch + ":" + .source.path) else .build_type end')
          if [[ "$source" == "master:/" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          else
            echo "::notice::Pages source is '$source'; no branch build requested."
          fi
